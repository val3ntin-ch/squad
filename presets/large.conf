# squad team definition: five devs, for a large task that splits into many
# independent parts. See default.conf for the line format and the settings.

seat lead      claude  lead      -                              --model claude-fable-5-2
seat dev-a     claude  dev       -                              --model claude-opus-5-5 --effort medium
seat dev-b     claude  dev       -                              --model claude-opus-5-5 --effort medium
seat dev-c     claude  dev       -                              --model claude-opus-5-5 --effort medium
seat dev-d     claude  dev       -                              --model claude-opus-5-5 --effort medium
seat dev-e     claude  dev       -                              --model claude-opus-5-5 --effort medium
seat tester    claude  tester    -                              --model claude-sonnet-5-5 --effort low
seat rev-gpt   codex   reviewer  dev-a,dev-b,dev-c,dev-d,dev-e  -m gpt-6.1-sol -c model_reasoning_effort=medium
seat observer  claude  observer  -                              --model claude-sonnet-5-5 --effort low

base team/integration
rounds 5
escalate_model claude-fable-5-2
observer_deep_model claude-opus-5-5
consult codex --search exec -m gpt-6.1-sol -c model_reasoning_effort=medium
heavy_timeout 20
heavy_timeout_dev 10
sample_percent 10
stall_minutes 15
observe_minutes 20
verify_hook off

# visual: you test what can be seen and give feedback (squad feedback); the lead decides the rest.
# all: every provisional decision waits for you.
owner visual
setup
