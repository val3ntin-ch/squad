# squad team definition
#
#   seat <name> <agent> <role> <reviews> [agent arguments...]
#
#   name     lowercase, unique, e.g. dev-a
#   agent    the agent CLI herdr starts for the seat (claude, codex)
#   role     lead | dev | tester | reviewer | observer   (exactly one lead)
#   reviews  for a reviewer seat: the dev(s) it reviews, comma-separated. Otherwise "-"
#   arguments are passed to the agent's own CLI unchanged (no quoted spaces)
#
# The lead plans, decides and merges. It has the strongest model, because one
# wrong plan or one wrong decision costs more than every dev's tokens together.
# Devs run a strong model at medium effort. The tester is QA: it agrees each
# task's acceptance contract before code, then collects the evidence.
# The reviewer is another vendor with a fresh context: it reviews every diff
# after the tester's PASS, and the lead decides on each finding.
# The observer watches the team and writes what goes wrong and what to change.

seat lead      claude  lead      -                  --model claude-fable-5-2
seat dev-a     claude  dev       -                  --model claude-opus-5-5 --effort medium
seat dev-b     claude  dev       -                  --model claude-opus-5-5 --effort medium
seat dev-c     claude  dev       -                  --model claude-opus-5-5 --effort medium
seat tester    claude  tester    -                  --model claude-sonnet-5-5 --effort low
seat rev-gpt   codex   reviewer  dev-a,dev-b,dev-c  -m gpt-6.1-sol -c model_reasoning_effort=medium
seat observer  claude  observer  -                  --model claude-sonnet-5-5 --effort low

# Branch that finished tasks are merged into. Created from HEAD on first run.
base team/integration

# How many review rounds a task may take before the lead brings it to you.
rounds 5

# From round 4, a fix runs on this model (squad dispatch --escalate).
escalate_model claude-fable-5-2

# The observer's deep pass, after a pass that found a loss over 30 minutes.
observer_deep_model claude-opus-5-5

# The lead's second opinion on a real issue (squad consult): GPT with web search.
consult codex --search exec -m gpt-6.1-sol -c model_reasoning_effort=medium

# Minutes a heavy run may hold the lock (heavy_timeout_dev: a dev's diagnostic run,
# shorter; the full suite is the tester's); minutes without work before a seat with
# an open task counts as stalled; the longest gap between observer passes.
heavy_timeout 20
heavy_timeout_dev 10
stall_minutes 15
observe_minutes 20

# off: team worktrees get .agents-verify-off, so a global Stop hook that runs the
# whole repository's verify at every turn end skips them (the tester's runs are the gate).
verify_hook off

# Command run once in each new worktree so it can build and test.
# Example:  setup pnpm install --frozen-lockfile
setup
