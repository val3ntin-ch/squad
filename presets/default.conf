# squad team definition
#
#   seat <name> <agent> <role> <reviews> [agent arguments...]
#
#   name     lowercase, unique, e.g. dev-a
#   agent    any agent herdr can start: claude, codex, opencode, gemini, cursor, ...
#   role     lead | dev | reviewer | tester   (exactly one lead)
#   reviews  for a reviewer: the dev(s) it reviews, comma-separated. Otherwise "-"
#   arguments are passed to the agent's own CLI unchanged (no quoted spaces)
#
# Pair each dev with a reviewer that runs a different vendor's model.

seat lead        codex   lead      -      -m gpt-6.1-sol
seat dev-a       claude  dev       -      --model claude-opus-5-5
seat dev-b       codex   dev       -      -m gpt-6.1-sol
seat rev-sol     codex   reviewer  dev-a  -m gpt-6.1-sol
seat rev-claude  claude  reviewer  dev-b  --model claude-opus-5-5
seat tester      claude  tester    -      --model claude-sonnet-5-5

# Branch that finished tasks are merged into. Created from HEAD on first run.
base team/integration

# Command run once in each new worktree so it can build and test.
# Example:  setup yarn install --immutable
setup
