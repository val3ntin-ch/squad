# squad team definition
#
#   seat <name> <agent> <role> <reviews> [agent arguments...]
#
#   name     lowercase, unique, e.g. dev-a
#   agent    the agent CLI herdr starts for the seat (claude)
#   role     lead | dev | tester | reviewer   (exactly one lead)
#   reviews  for a reviewer seat: the dev(s) it reviews, comma-separated. Otherwise "-"
#   arguments are passed to the agent's own CLI unchanged (no quoted spaces)
#
# The lead plans, reviews and merges. It has the strongest model, because one
# wrong plan or one skipped review costs more than every dev's tokens together.
# Devs run a strong model at medium effort. The tester is cheap: it only runs
# commands and collects evidence.

seat lead    claude  lead    -  --model claude-fable-5-2
seat dev-a   claude  dev     -  --model claude-opus-5-5 --effort medium
seat dev-b   claude  dev     -  --model claude-opus-5-5 --effort medium
seat dev-c   claude  dev     -  --model claude-opus-5-5 --effort medium
seat tester  claude  tester  -  --model claude-sonnet-5-5 --effort low

# Branch that finished tasks are merged into. Created from HEAD on first run.
base team/integration

# How many review rounds a task may take before the lead brings it to you.
rounds 5

# Command run once in each new worktree so it can build and test.
# Example:  setup pnpm install --frozen-lockfile
setup
