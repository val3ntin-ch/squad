name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install shellcheck jq
          else sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck jq; fi
      - name: shellcheck
        run: shellcheck -S warning bin/squad install.sh test/smoke.sh
      - name: smoke test
        run: bash test/smoke.sh
      # macOS ships bash 3.2 as /bin/bash: squad must work with it
      - name: smoke test (bash 3.2)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bash32" && ln -sf /bin/bash "$RUNNER_TEMP/bash32/bash"
          PATH="$RUNNER_TEMP/bash32:$PATH" bash -c 'bash --version | head -1 && bash test/smoke.sh'
